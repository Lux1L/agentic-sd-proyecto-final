services:
  web-api:
    image: ${DOCKER_REGISTRY-}webapi
    container_name: arriendo-api
    build:
      context: .
      dockerfile: src/Web.Api/Dockerfile
    ports:
      - 5080:8080
    profiles: [ "full" ]
    environment:
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=arriendo-familiar;Username=postgres;Password=postgres;Include Error Detail=true
    depends_on:
      - postgres

  postgres:
    image: postgres:18.6
    container_name: arriendo-postgres
    environment:
      - POSTGRES_DB=arriendo-familiar
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/db:/var/lib/postgresql
    ports:
      - 5432:5432

  # Grafana + Loki (logs) + Tempo (traces) + Prometheus (metrics) + an OpenTelemetry
  # Collector, all bundled in one image. Open Grafana at http://localhost:3000.
  observability:
    image: grafana/otel-lgtm:0.29.1
    container_name: arriendo-observability
    profiles: [ "observability", "full" ]
    ports:
      - 3000:3000   # Grafana
      - 4317:4317   # OTLP gRPC
      - 4318:4318   # OTLP HTTP
