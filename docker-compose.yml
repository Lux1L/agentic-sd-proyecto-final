# Requiere un .env con POSTGRES_PASSWORD y JWT_SECRET (cp .env.example .env); llegan a los contenedores como secrets.
# `docker compose up -d`                 → solo PostgreSQL (para `dotnet run` + `pnpm dev`)
# `docker compose --profile app up -d`   → PostgreSQL + API (5080) + frontend (5173)
# `docker compose --profile full up -d`  → lo anterior + observabilidad (3000)
services:
  web-api:
    image: ${DOCKER_REGISTRY-}webapi
    container_name: arriendo-api
    build:
      context: .
      dockerfile: src/Web.Api/Dockerfile
    ports:
      - 127.0.0.1:${API_PORT:-5080}:8080
    profiles: [ "app", "full" ]
    environment:
      # Development: aplica migraciones, carga los datos de demo y expone Scalar (Dokploy no lee el override).
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=arriendo-familiar;Username=postgres;Include Error Detail=true
    secrets:
      - source: db_password
        target: Database__Password
      - source: jwt_secret
        target: Jwt__Secret
    cap_drop: [ "ALL" ]
    security_opt: [ "no-new-privileges:true" ]
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: arriendo-web
    container_name: arriendo-web
    build:
      context: ./web
    ports:
      - 127.0.0.1:${WEB_PORT:-5173}:8080
    profiles: [ "app", "full" ]
    cap_drop: [ "ALL" ]
    security_opt: [ "no-new-privileges:true" ]
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/" ]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      web-api:
        condition: service_healthy

  postgres:
    image: postgres:18.6
    container_name: arriendo-postgres
    # Corre directo como postgres: con un volumen con nombre no necesita chown ni capabilities.
    user: postgres
    environment:
      - POSTGRES_DB=arriendo-familiar
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - 127.0.0.1:5432:5432
    cap_drop: [ "ALL" ]
    security_opt: [ "no-new-privileges:true" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d arriendo-familiar" ]
      interval: 2s
      timeout: 3s
      retries: 15

  # Grafana + Loki (logs) + Tempo (traces) + Prometheus (metrics) + an OpenTelemetry
  # Collector, all bundled in one image. Open Grafana at http://localhost:3000.
  observability:
    image: grafana/otel-lgtm:0.29.1
    container_name: arriendo-observability
    profiles: [ "observability", "full" ]
    ports:
      - 127.0.0.1:3000:3000   # Grafana
      - 127.0.0.1:4317:4317   # OTLP gRPC
      - 127.0.0.1:4318:4318   # OTLP HTTP
    cap_drop: [ "ALL" ]
    security_opt: [ "no-new-privileges:true" ]
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health" ]
      interval: 10s
      timeout: 3s
      retries: 12

secrets:
  db_password:
    environment: POSTGRES_PASSWORD
  jwt_secret:
    environment: JWT_SECRET

volumes:
  pgdata:
